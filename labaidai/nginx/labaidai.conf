server {
    listen 80;
    listen [::]:80;
    server_name labaidai.lifeplusbd.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labaidai.lifeplusbd.tech;

    root /var/www/lifeplusbd-projects/labaidai/dist;
    index index.html;

    access_log /var/log/nginx/labaidai-access.log;
    error_log /var/log/nginx/labaidai-error.log;

    ssl_certificate /etc/letsencrypt/live/labaidai.lifeplusbd.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labaidai.lifeplusbd.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
