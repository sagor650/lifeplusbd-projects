server {
    listen 80;
    listen [::]:80;
    server_name labaidai.lifeplusbd.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        root /var/www/lifeplusbd-projects/labaidai/dist;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }
}
